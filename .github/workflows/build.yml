# Сборка под Windows, macOS и Linux на каждый push; по тегу v* — релиз с бинарниками.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Иконка и манифест exe
        run: go run github.com/tc-hib/go-winres@latest simply --arch amd64 --manifest gui --icon assets/icon.png
      - name: Сборка
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${{ github.ref_name }}" -o dist/langswitch-windows-amd64.exe .
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Сборка (arm64 + amd64)
        env:
          CGO_ENABLED: "1"
          LDFLAGS: -s -w -X main.version=${{ github.ref_name }}
        run: |
          GOARCH=arm64 CC="clang -arch arm64" go build -trimpath -ldflags "$LDFLAGS" -o build/langswitch-arm64 .
          GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -ldflags "$LDFLAGS" -o build/langswitch-amd64 .
          lipo -create -output build/langswitch build/langswitch-arm64 build/langswitch-amd64
      - name: Пакет LangSwitch.app
        run: |
          packaging/macos/bundle.sh build/langswitch "${{ github.ref_name }}" build
          mkdir -p dist
          ditto -c -k --keepParent build/LangSwitch.app dist/langswitch-macos-universal.zip
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/*

  linux:
    # Самый старый из доступных образов: бинарник будет работать на дистрибутивах с glibc не старше 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxtst-dev libxkbcommon-dev libwayland-dev
      - name: Проверки
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - name: Сборка
        env:
          CGO_ENABLED: "1"
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o build/langswitch .
          mkdir -p dist
          tar -czf dist/langswitch-linux-amd64.tar.gz -C build langswitch
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
